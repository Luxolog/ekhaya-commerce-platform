<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071B31">
  <title>You're offline | Ekhaya Price Checker</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F4F8FC;color:#071B31;font-family:Arial,sans-serif}
    main{max-width:520px;padding:36px;background:#fff;border:1px solid #DCE8F1;border-radius:16px;text-align:center}
    .mark{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 18px;border-radius:12px;background:#071B31;color:#00A9E8;font-size:27px;font-weight:800}
    h1{font-size:28px;margin:0 0 12px}p{color:#60758A;line-height:1.7;font-size:14px}
    a{display:inline-block;margin-top:12px;padding:13px 18px;background:#079BD3;color:white;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="mark">E</div>
    <h1>You're offline</h1>
    <p>Ekhaya Price Checker needs an internet connection for seller sign-in, live marketplace searches and current subscription or search-limit information.</p>
    <p>Reconnect to the internet and try again. No live prices or account information are available offline.</p>
    <a href="/price-checker/">Try Price Checker again</a>
  </main>
</body>
</html>
