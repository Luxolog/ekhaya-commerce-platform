name: Quality checks

on:
  push:
    branches:
      - main
      - feature/saechamber-public-showcase
  pull_request:
    # These are BASE branches. PR #33 currently targets
    # feature/partner-admin-email-otp, not the feature head branch.
    branches:
      - main
      - feature/partner-admin-email-otp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Do not cancel a required release check when another commit is pushed.
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build
