name: Production availability checks

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check permanent partner portal and account routes
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/account/" "/partner/saechamber/" "/owner/" "/owner/saechamber/" "/owner/pilot/"; do
            echo "Checking https://pricechecker.ekhayatech.co.za${path}"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
              --output /dev/null \
              "https://pricechecker.ekhayatech.co.za${path}"
          done
