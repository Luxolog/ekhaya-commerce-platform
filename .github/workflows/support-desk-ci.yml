name: Support Desk CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/support-desk/**"
      - ".github/workflows/support-desk-ci.yml"
  workflow_dispatch:

concurrency:
  group: support-desk-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/support-desk
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/support-desk/package-lock.json
      - name: Generate lockfile when missing
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000
            git add package-lock.json
            git -C ../.. config user.name "github-actions[bot]"
            git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C ../.. commit -m "Add Support Desk npm lockfile"
            git -C ../.. push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000
      - name: Build Support Desk
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
