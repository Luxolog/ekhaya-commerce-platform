name: Support Desk CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/support-desk/**"
      - ".github/workflows/support-desk-ci.yml"
  workflow_dispatch:

concurrency:
  group: support-desk-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/support-desk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/support-desk/package.json

      # There is intentionally no generated lockfile step here. The previous
      # package-lock-only resolution stalled before any useful checks ran.
      # Install from the app's exact package.json pins, then validate the app.
      - name: Install Support Desk dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --fetch-retries=2 --fetch-timeout=120000

      - name: Lint Support Desk
        run: npm run lint

      - name: Type-check Support Desk
        run: npx --no-install tsc --noEmit

      - name: Build Support Desk
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
