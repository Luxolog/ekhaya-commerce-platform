name: Security checks

on:
  push:
    branches:
      - main
      - feature/saechamber-public-showcase
  pull_request:
    # PR filters match the BASE branch. PR #33 currently targets this
    # dependency branch, so security checks must run before that dependency
    # chain is reconciled with main.
    branches:
      - main
      - feature/partner-admin-email-otp
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type-check application
        run: npx tsc --noEmit

  edge-functions:
    name: Supabase Edge Function type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check production Edge Functions
        run: >-
          deno check --no-lock --node-modules-dir=auto
          supabase/functions/marketplace-search/index.ts
          supabase/functions/product-identify/index.ts
          supabase/functions/invite-saechamber-partner/index.ts
          supabase/functions/accept-saechamber-partner-invitation/index.ts
          supabase/functions/notification-worker/index.ts
          supabase/functions/partner-admin-email-otp/index.ts
      - name: Run authentication guard regression tests
        run: deno test --no-lock --node-modules-dir=auto supabase/tests/auth-guards.test.ts

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyse
        uses: github/codeql-action/analyze@v3
