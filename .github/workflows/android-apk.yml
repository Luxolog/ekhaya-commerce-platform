name: Standalone Ekhaya Price Checker Android APK

permissions:
  contents: read

concurrency:
  group: price-checker-android-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - feature/standalone-price-checker-app

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Build standalone mobile web app
        run: npm run mobile:build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app-specific launcher icons
        run: |
          mkdir -p resources
          npm install --no-save sharp @capacitor/assets
          node -e "const sharp=require('sharp'); sharp('mobile/public/app-icon.svg').resize(1024,1024).png().toFile('resources/icon.png')"
          npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ekhaya-price-checker-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
