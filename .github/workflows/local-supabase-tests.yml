name: Local Supabase database tests

on:
  push:
    branches:
      - feature/saechamber-public-showcase
  pull_request:
    branches:
      - feature/partner-admin-email-otp
      - feature/saechamber-public-showcase
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-db-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  database-tests:
    name: Supabase migrations and database contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start isolated local Supabase stack
        id: start
        run: supabase start

      - name: Validate migration and database contracts
        run: supabase test db

      - name: Stop local Supabase stack
        if: always() && steps.start.outcome == 'success'
        run: supabase stop --no-backup
